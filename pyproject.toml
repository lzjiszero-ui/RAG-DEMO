[project]
name = "simple-rag"
version = "0.1.0"
description = "A beginner-friendly RAG project using Ollama, Qdrant, and FastAPI."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.111.0",
  "fastembed>=0.8.0",
  "httpx>=0.27.1,<1",
  "langchain-core>=1.6.0",
  "langchain-ollama>=1.1.0",
  "langchain-qdrant>=1.1.0",
  "langchain-text-splitters>=1.1.2",
  "mcp>=1.13,<2",
  "python-dotenv==1.0.1",
  "qdrant-client==1.19.0",
  "uvicorn>=0.31.1,<1",
]

[dependency-groups]
dev = ["pytest==8.2.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
